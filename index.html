function nextPlayer(){if(!S.order.length){var o=shuf(S.p.map(function(_,i){return i}));if(o.length>1&&o[0]===S.turn)o.push(o.shift());S.order=o}S.turn=S.order.shift();return S.p[S.turn]}
function fill(t){var others=S.p.filter(function(_,i){return i!==S.turn});var o=others[Math.random()*others.length|0]||'';
 return esc(t).replace(/\{p\}|\{현재\}/g,'<b>'+esc(S.p[S.turn])+'</b>').replace(/\{o\}|\{상대\}/g,'<b>'+esc(o)+'</b>')}
function start(){if(S.p.length<2)return;if(S.lv===4&&!S.adult)S.lv=3;try{localStorage.setItem('tg2_names',JSON.stringify(S.p))}catch(e){}
 S.mode=S.p.length==2?'duo':'group';S.rules=[];S.order=[];S.turn=-1;S.drawn=0;S.used={};S.tuse={};S.last=[];S.gen=0;buildQ();
 $('setup').classList.add('h');$('game').classList.remove('h');$('glabel').textContent=(S.mode=='duo'?'💞 1:1':'🎉 단체')+' · '+S.lv;draw();}
$('start').onclick=start;
$('home').onclick=function(){$('game').classList.add('h');$('setup').classList.remove('h');renderSetup()};
function renderRules(){$('rules').innerHTML=S.rules.map(function(r){return '<div class="rb">📜 '+r.h+' <b>· '+r.left+'턴 남음</b></div>'}).join('')}
var flipT,toastT;
function step(){S.rules.forEach(function(r){r.left--});S.rules=S.rules.filter(function(r){return r.left>0});
 var c=nextCard();S.drawn++;var who=nextPlayer();
 if(c.type==='rule'){S.rules.push({h:fill(c.text),left:(c.turns|0)||3});while(S.rules.length>2)S.rules.shift()}
 window.__tg={card:c,who:who,rules:S.rules.length,mode:S.mode,gen:S.gen,drawn:S.drawn};return c}
function draw(){var c=step(),t=T[c.type];renderRules();$('turn').textContent='👉 '+window.__tg.who+' 차례';
 var card=$('card');card.classList.remove('fl');card.classList.remove('gen');clearTimeout(flipT);
 $('txt').style.fontSize=c.type==='choice'?'19px':'';$('txt').innerHTML=fill(c.text).replace(/\n/g,'<br>')+(c.type==='rule'?'<div style="font-size:14px;opacity:.7;margin-top:10px">'+((c.turns|0)||3)+'턴 동안 유지</div>':'');
 flipT=setTimeout(function(){card.classList.add('fl');if(c.gen)card.classList.add('gen')},30);
 if(c.gen){$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){$('toast').classList.remove('on')},1300)}
 $('free').classList.toggle('h',c.type!=='touch');$('evr').classList.toggle('h',!(c.type==='event'&&c.text.indexOf('룰렛')>=0));}
$('next').onclick=draw;$('free').onclick=draw;
function ptext(p){return (S.na&&p.kind==='drink'&&p.alt)?p.alt:p.text}
var spinning=false,PREV=[];D.penalties.forEach(function(p){if(PREV.length<40)PREV.push(p)});
function roulette(who){if(spinning)return;spinning=true;var pick=nextPen();var L=D.penalties.filter(function(x){return (x.mode===S.mode||x.mode==='all')&&(x.level|0)===S.lv});if(!L.length)L=[pick];
 $('pwho').textContent=who?who+' 벌칙!':'';$('pov').classList.remove('h');$('pmd').className='md spin';$('pdone').classList.add('h');
 var n=0,delay=50;(function tick(){$('ptxt').textContent=ptext(rnd(L));n++;
  if(n<14){delay*=1.15;setTimeout(tick,delay)}else{$('ptxt').innerHTML='<span>'+fill(ptext(pick))+'</span>';$('pmd').className='md land';$('pdone').classList.remove('h');spinning=false;window.__pen={p:pick,shown:ptext(pick)}}})();}
$('roul').onclick=function(){roulette(S.p[S.turn])};$('evr').onclick=function(){roulette('')};$('pass').onclick=function(){roulette(S.p[S.turn])};
$('pdone').onclick=function(){$('pov').classList.add('h')};
renderSetup();
if(/[?&]dbg=1/.test(location.search))window.__dbg={S:S,setup:function(names,lv,na){S.p=names.slice();S.adult=true;S.lv=lv;S.na=!!na;renderSetup();start()},
 step:step,pen:function(){var p=nextPen();return {p:p,shown:ptext(p)}},nPool:function(){return D.cards.filter(function(c){return c.mode===S.mode&&(c.level|0)===S.lv}).length},
 nPen:function(){return D.penalties.filter(function(p){return (p.mode===S.mode||p.mode==='all')&&(p.level|0)===S.lv}).length}};
})();
</script></body></html>
