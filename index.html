function buildQ(){S.Q={};MT[S.mode].forEach(function(t){S.Q[t]={1:[],2:[],3:[],4:[]}});
 D.cards.forEach(function(c){if(c.mode===S.mode&&S.Q[c.type]&&c.text)S.Q[c.type][c.level].push(c)});
 MT[S.mode].forEach(function(t){for(var l=1;l<=4;l++)shuf(S.Q[t][l])});
 S.PQ={1:[],2:[],3:[],4:[]};S.FV={1:[],2:[],3:[],4:[]};S.fl=[];D.penalties.forEach(function(p){if((p.mode===S.mode||p.mode==='all')&&p.text)(p.fav?S.FV:S.PQ)[p.level|0].push(p)});for(var l=1;l<=4;l++)shuf(S.PQ[l]);}

 S.Q[type]={1:[],2:[],3:[],4:[]};
 D.cards.forEach(function(c){if(c.mode===S.mode&&c.type===type&&c.text)S.Q[type][c.level].push(c)});
 for(var l=1;l<=4;l++)shuf(S.Q[type][l]);
}

 D.penalties.forEach(function(p){if((p.mode===S.mode||p.mode==='all')&&p.text)delete S.used[p.text]});
 S.PQ={1:[],2:[],3:[],4:[]};S.FV={1:[],2:[],3:[],4:[]};S.fl=[];
 D.penalties.forEach(function(p){if((p.mode===S.mode||p.mode==='all')&&p.text)(p.fav?S.FV:S.PQ)[p.level|0].push(p)});

function pickW(ws){var s=0,k;for(k in ws)s+=ws[k];var r=Math.random()*s;for(k in ws){r-=ws[k];if(r<=0)return k}return k}
var MIX={1:{1:.8,2:.1,3:.06,4:.04},2:{2:.8,3:.1,1:.06,4:.04},3:{3:.8,4:.1,2:.06,1:.04},4:{4:.8,3:.1,2:.06,1:.04}};
var FAVP={1:0,2:0,3:.18,4:.32};

function near(lv){return [1,2,3,4].sort(function(a,b){return (Math.abs(a-lv)-Math.abs(b-lv))||(Math.abs(a-S.lv)-Math.abs(b-S.lv))})}

 if(S.last.length>=2&&S.last[0]===S.last[1])delete tw[S.last[0]];
 var type=(S.last[0]!=='choice'&&Math.random()<CP)?'choice':pickW(tw),lw=levelW(),lv=+pickW(lw),c=popQ(S.Q[type][lv]);
 if(!c)c=popQ(S.Q[type][S.lv]);
 if(!c)c=popN(S.Q[type],lv);
 if(c)c=cloneC(c);
 else if(LANG==='en'){refillType(type);c=popQ(S.Q[type][lv])||popQ(S.Q[type][S.lv])||popN(S.Q[type],lv);if(c)c=cloneC(c)}
 else{c=generate(S.mode+':'+type,S.lv);if(c){c.type=type;c.mode=S.mode;S.gen++}}
 if(!c){c={type:type,mode:S.mode,level:1,text:I.fallbackCard,gen:LANG==='ko'?1:0}}
 S.used[c.text]=1;S.last.unshift(type);S.last.length=Math.min(S.last.length,2);return c}
function favPick(lv){var L=S.FV[lv];if(!L||!L.length||Math.random()>=FAVP[lv])return null;var c,k=0;do{c=L[Math.random()*L.length|0];k++}while(S.fl.indexOf(c.text)>=0&&k<30);
 S.fl.unshift(c.text);S.fl.length=Math.min(S.fl.length,8,L.length-1);return c}
function nextPen(){var lv=+pickW(levelW()),c=favPick(lv);if(c)return c;c=popQ(S.PQ[lv]);if(!c)c=popQ(S.PQ[S.lv]);if(!c)c=popN(S.PQ,lv);
 if(!c){if(LANG==='en'){refillPens();c=favPick(lv)||popQ(S.PQ[lv])||popQ(S.PQ[S.lv])||popN(S.PQ,lv)}else{c=generate('pen:'+S.mode,S.lv);if(c)S.gen++}}
 if(!c)c={text:I.fallbackPen,kind:'drink',alt:I.fallbackAlt,level:1,gen:LANG==='ko'?1:0};
 S.used[c.text]=1;return c}

 var c=nextCard();S.drawn++;var who=nextPlayer();
