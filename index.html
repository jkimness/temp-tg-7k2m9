 MT[S.mode].forEach(function(t){for(var l=1;l<=4;l++)shuf(S.Q[t][l])});
 S.PQ={1:[],2:[],3:[],4:[]};D.penalties.forEach(function(p){if((p.mode===S.mode||p.mode==='all')&&((p.level|0)<4||S.adult||S.lv===4)&&p.text)S.PQ[p.level|0].push(p)});for(var l=1;l<=4;l++)shuf(S.PQ[l]);}
function pickW(ws){var s=0,k;for(k in ws)s+=ws[k];var r=Math.random()*s;for(k in ws){r-=ws[k];if(r<=0)return k}return k}
// Level mixing (Jae 2026-10-28): share of cards drawn from OTHER levels per spice level. Tune here.
// p = probability that a draw comes from another level; from = relative weights of those other levels. L4 cards only mix in after 19금 consent.
var MIX={1:{p:.015,from:{4:1}},2:{p:.045,from:{1:1,3:1}},3:{p:.10,from:{1:1,2:2,4:1}},4:{p:.015,from:{1:1}}};
function levelW(){var m=MIX[S.lv],w={},t=0,l;for(l in m.from){if(+l===4&&!S.adult&&S.lv!==4)continue;t+=m.from[l]}
 if(!t){w[S.lv]=1;return w}
 w[S.lv]=1-m.p;for(l in m.from){if(+l===4&&!S.adult&&S.lv!==4)continue;w[l]=m.p*m.from[l]/t}return w}
function popQ(q){while(q.length){var c=q.pop();if(!S.used[c.text])return c}return null}
function nextCard(){var tw={};MT[S.mode].forEach(function(t){var q=S.Q[t],r=q[S.lv].length;tw[t]=(TW[t]||1)*(r+2)});
 if(S.last.length>=2&&S.last[0]===S.last[1])delete tw[S.last[0]];
 var type=pickW(tw),lw=levelW(),lv=+pickW(lw),c=popQ(S.Q[type][lv]);
 if(!c)c=popQ(S.Q[type][S.lv]);
 if(c)c={type:c.type,text:c.text,mode:c.mode,level:c.level,turns:c.turns};
 else{c=generate(S.mode+':'+type,S.lv);if(c){c.type=type;c.mode=S.mode;S.gen++}}
 if(!c){c={type:type,mode:S.mode,level:1,text:'🍻 다 같이 건배 한 잔!',gen:1}}
 S.used[c.text]=1;S.last.unshift(type);S.last.length=Math.min(S.last.length,2);return c}
function nextPen(){var c=popQ(S.PQ[+pickW(levelW())]);if(!c)c=popQ(S.PQ[S.lv]);
 if(!c){c=generate('pen:'+S.mode,S.lv);if(c)S.gen++}
 if(!c)c={text:'🍻 한 잔!',kind:'drink',alt:'🥤 음료 한 모금',level:1,gen:1};
 S.used[c.text]=1;return c}
// ---- UI ----
function renderSetup(){
 $('chips').innerHTML=S.p.map(function(n,i){return '<span class="chip">'+esc(n)+'<button data-rm="'+i+'" aria-label="삭제">×</button></span>'}).join('');
 var n=S.p.length;$('mode').textContent=n<2?'2명 이상 넣어주세요':(n==2?'💞 1:1 모드':'🎉 단체 모드 ('+n+'명)');
 $('start').disabled=n<2;$('start').style.opacity=n<2?.5:1;
 $('lv').innerHTML=LV.map(function(l){return '<button class="b g'+(S.lv==l[0]?' on':'')+'" data-lv="'+l[0]+'">'+l[1]+'</button>'}).join('');
 $('r5').textContent=S.lv==4?'19금은 모두 패스 가능 · 거절해도 OK, 서로 존중 💗':'싫은 건 언제든 거절, 서로 존중 💗';syncNA();}
function syncNA(){$('na1').classList.toggle('on',S.na);$('na2').classList.toggle('on',S.na)}
function add(){var v=$('nm').value.trim();if(!v)return;if(S.p.indexOf(v)<0&&S.p.length<12)S.p.push(v);$('nm').value='';renderSetup();$('nm').focus()}
$('add').onclick=add;$('nm').onkeydown=function(e){if(e.key==='Enter')add()};
$('chips').onclick=function(e){var r=e.target.getAttribute('data-rm');if(r!==null){S.p.splice(+r,1);renderSetup()}};
$('lv').onclick=function(e){var l=e.target.getAttribute('data-lv');if(!l)return;l=+l;if(l===4&&!S.adult){$('aov').classList.remove('h');return}S.lv=l;renderSetup()};
$('aok').onclick=function(){S.adult=true;S.lv=4;$('aov').classList.add('h');renderSetup()};
$('ano').onclick=function(){$('aov').classList.add('h');renderSetup()};
$('na1').onclick=$('na2').onclick=function(){S.na=!S.na;syncNA()};
document.querySelectorAll('[data-help]').forEach(function(b){b.onclick=function(){$('hov').classList.remove('h')}});
$('hdone').onclick=function(){$('hov').classList.add('h')};
function nextPlayer(){if(!S.order.length){var o=shuf(S.p.map(function(_,i){return i}));if(o.length>1&&o[0]===S.turn)o.push(o.shift());S.order=o}S.turn=S.order.shift();return S.p[S.turn]}
function fill(t){var others=S.p.filter(function(_,i){return i!==S.turn});var o=others[Math.random()*others.length|0]||'';
 return esc(t).replace(/\{p\}|\{현재\}/g,'<b>'+esc(S.p[S.turn])+'</b>').replace(/\{o\}|\{상대\}/g,'<b>'+esc(o)+'</b>')}
function start(){if(S.p.length<2)return;if(S.lv===4&&!S.adult)S.lv=3;try{localStorage.setItem('tg2_names',JSON.stringify(S.p))}catch(e){}
 S.mode=S.p.length==2?'duo':'group';S.rules=[];S.order=[];S.turn=-1;S.drawn=0;S.used={};S.tuse={};S.last=[];S.gen=0;buildQ();
 $('setup').classList.add('h');$('game').classList.remove('h');$('glabel').textContent=(S.mode=='duo'?'💞 1:1':'🎉 단체')+' · '+LV[S.lv-1][1];draw();}
$('start').onclick=start;
$('home').onclick=function(){$('game').classList.add('h');$('setup').classList.remove('h');renderSetup()};
function renderRules(){$('rules').innerHTML=S.rules.map(function(r){return '<div class="rb">📜 '+r.h+' <b>· '+r.left+'턴 남음</b></div>'}).join('')}
var flipT,toastT;
function step(){S.rules.forEach(function(r){r.left--});S.rules=S.rules.filter(function(r){return r.left>0});
 var c=nextCard();S.drawn++;var who=nextPlayer();
 if(c.type==='rule'){S.rules.push({h:fill(c.text),left:(c.turns|0)||3});while(S.rules.length>2)S.rules.shift()}
 window.__tg={card:c,who:who,rules:S.rules.length,mode:S.mode,gen:S.gen,drawn:S.drawn};return c}
function draw(){var c=step(),t=T[c.type];renderRules();$('turn').textContent='👉 '+window.__tg.who+' 차례';
 var card=$('card');card.classList.remove('fl');card.classList.remove('gen');clearTimeout(flipT);
 $('txt').innerHTML=fill(c.text)+(c.type==='rule'?'<div style="font-size:14px;opacity:.7;margin-top:10px">'+((c.turns|0)||3)+'턴 동안 유지</div>':'');
 flipT=setTimeout(function(){card.classList.add('fl');if(c.gen)card.classList.add('gen')},30);
 if(c.gen){$('toast').classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){$('toast').classList.remove('on')},1300)}
 $('free').classList.toggle('h',c.type!=='touch');$('evr').classList.toggle('h',!(c.type==='event'&&c.text.indexOf('룰렛')>=0));}
$('next').onclick=draw;$('free').onclick=draw;
function ptext(p){return (S.na&&p.kind==='drink'&&p.alt)?p.alt:p.text}
var spinning=false,PREV=[];D.penalties.forEach(function(p){if(PREV.length<40)PREV.push(p)});
function roulette(who){if(spinning)return;spinning=true;var pick=nextPen();var L=D.penalties.filter(function(x){return (x.mode===S.mode||x.mode==='all')&&(x.level|0)===S.lv});if(!L.length)L=[pick];
 $('pwho').textContent=who?who+' 벌칙!':'';$('pov').classList.remove('h');$('pmd').className='md spin';$('pdone').classList.add('h');
 var n=0,delay=50;(function tick(){$('ptxt').textContent=ptext(rnd(L));n++;
  if(n<14){delay*=1.15;setTimeout(tick,delay)}else{$('ptxt').innerHTML='<span>'+fill(ptext(pick))+'</span>';$('pmd').className='md land';$('pdone').classList.remove('h');spinning=false;window.__pen={p:pick,shown:ptext(pick)}}})();}
$('roul').onclick=function(){roulette(S.p[S.turn])};$('evr').onclick=function(){roulette('')};$('pass').onclick=function(){roulette(S.p[S.turn])};
$('pdone').onclick=function(){$('pov').classList.add('h')};
renderSetup();
if(/[?&]dbg=1/.test(location.search))window.__dbg={S:S,setup:function(names,lv,na){S.p=names.slice();S.adult=true;S.lv=lv;S.na=!!na;renderSetup();start()},
 step:step,pen:function(){var p=nextPen();return {p:p,shown:ptext(p)}},nPool:function(){return D.cards.filter(function(c){return c.mode===S.mode&&(c.level|0)===S.lv}).length},
 nPen:function(){return D.penalties.filter(function(p){return (p.mode===S.mode||p.mode==='all')&&(p.level|0)===S.lv}).length}};
})();
</script></body></html>
